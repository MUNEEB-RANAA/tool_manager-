<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
    <defs>
        <linearGradient id="tmGradA" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe"/>
            <stop offset="100%" stop-color="#4facfe"/>
        </linearGradient>
        <linearGradient id="tmGradB" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <linearGradient id="tmGradC" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899"/>
            <stop offset="100%" stop-color="#f43f5e"/>
        </linearGradient>
        <filter id="tmGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <!-- Background Frame -->
    <rect width="48" height="48" rx="12" fill="#0d111e" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <!-- Geometric T Bar -->
    <rect x="10" y="11" width="28" height="5.5" rx="2.75" fill="url(#tmGradA)"/>
    
    <!-- Flowing T Stem to M Left Leg -->
    <path d="M19 16.5 L19 32 C19 34.5 16.5 36.5 14 36.5 C11.5 36.5 10 34.5 10 32 L10 24" stroke="url(#tmGradA)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center M Peak & Descent -->
    <path d="M19 24 L24 31 L29 24 L29 36.5" stroke="url(#tmGradB)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right M Leg -->
    <path d="M29 16.5 L38 16.5 C38 16.5 38 28 38 32 C38 34.5 36 36.5 33.5 36.5 C31 36.5 29 34.5 29 32" stroke="url(#tmGradC)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ambient Energy Dot -->
    <circle cx="24" cy="31" r="2" fill="#ffffff" filter="url(#tmGlow)"/>
</svg>
